upstream ithub_backend {
    server 10.10.10.21:8080 max_fails=3;
    server app02.sirket.com.tr:8080 backup;
}
server {
    listen 443 ssl http2;
    server_name ithub.sirket.com.tr www.ithub.sirket.com.tr;
    ssl_certificate     /etc/letsencrypt/live/ithub.sirket.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ithub.sirket.com.tr/privkey.pem;
    access_log /var/log/nginx/ithub.access.log;
    location /api/ {
        proxy_pass http://ithub_backend;
        proxy_set_header Authorization "Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJkZXBsb3kifQ.c2lnbmF0dXJlMTIzNDU";
        allow 185.12.34.0/24;
        allow 10.0.0.0/8;
        deny all;
    }
}
